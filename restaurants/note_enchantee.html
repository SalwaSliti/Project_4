<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohmyfood - La Palette du Goût</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../SASS/style.css">
</head>
<body>
    <header class="mp-header">
        <a class="back-button" href="/index.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <img src="/images/logo/ohmyfood.png">
    </header>

    <main>
        <div class="bg-menu">
            <img src="/images/restaurants/note_enchante.jpg" alt="Image du restaurant la Note Enchantée">
        </div>
            <section class="menu-section">
                <h1>La note enchantée</h1>
                <i class="fa-regular fa-heart"></i>
                    <div class="menu-group">
                        <h2 class="menu-title">ENTRÉES</h2>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Ravioles de foie gras</h3>
                                    <p>Accompagnées de leur crème à la truffe</p>
                                </div>
                                <div class="menu-price"><span class="price">25€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Caviar osciètre</h3>
                                    <p>Sur blini à la farine de blé noir</p>
                                </div>
                                <div class="menu-price"><span class="price">35€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Homard et espuma de potiron</h3>
                                    <p>Marinés aux zestes d'orange</p>
                                </div>
                                <div class="menu-price"><span class="price">20€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Foie gras de canard cuit entier</h3>
                                    <p>Confiture de figue et pain toasté</p>
                                </div>
                                <div class="menu-price"><span class="price">35€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                    </div>
                    <div class="menu-group">
                        <h2 class="menu-title">PLATS</h2>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Noix de coquilles Saint-Jacques</h3>
                                    <p>Sur lit de purée de céleri-rave</p>
                                </div>
                                <div class="menu-price"><span class="price">40€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Langoustine poêlée</h3>
                                    <p>purée de patate douce</p>
                                </div>
                                <div class="menu-price"><span class="price">35€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Mijoté de queue de boeuf</h3>
                                    <p>Et riz sauvage aux zestes de citron</p>
                                </div>
                                <div class="menu-price"><span class="price">45€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                    </div>
                    <div class="menu-group">
                        <h2 class="menu-title">DESSERTS</h2>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Macaron noisette et chocolat</h3>
                                    <p>Glace au caramel brun et sel de Guérande</p>
                                </div>
                                <div class="menu-price"><span class="price">18€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Baba au rhum revisité</h3>
                                    <p>Avec son coulis de citron</p>
                                </div>
                                <div class="menu-price"><span class="price">22€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                            <button class="menu-card">
                                <div class="menu-card-text">
                                    <h3>Tarte au citron meringuée</h3>
                                    <p>Déstructurée</p>
                                </div>
                                <div class="menu-price"><span class="price">23€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </button>
                    </div>
                <button class="btn" href="#">Commander</button>
            </section>
        </div>
    </main>

    <footer>
        <div class="bg_footer">
            <h3>ohmyfood</h3>
                <ul>
                    <li><a href="#"><i class="fa-solid fa-utensils"></i>Proposer un restaurant</a></li>
                    <li><a href="#"><i class="fa-solid fa-handshake"></i>Devenir partenaire</a></li>
                    <li><a href="#"><i></i>Mentions légales</a></li>
                    <li><a href="#"><i></i>Contact</a></li>
                </ul>
        </div>
    </footer>
</body>
</html>
