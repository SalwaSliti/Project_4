<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohmyfood - La Palette du Goût</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../SASS/style.css">
</head>
<body>
    <header class="mp-header">
        <nav>
            <a class="back-button" href="/index.html">
            <i class="fa-solid fa-arrow-left"></i></a>
        </nav>
        <img src="../images/logo/ohmyfood.png" alt="logo du site Ohmyfood">
    </header>

    <main>
        <div class="bg-menu">
            <img src="../images/restaurants/a_la_francaise.jpg" alt="Image du restaurant À la française">
        </div>
            <section class="menu-section">
                <div class="restaurant-name">
                    <h1>À la française</h1>
                    <label for="like-francaise" class="like-button  like-francaise">
                        <input type="checkbox" id="like-francaise" class="like-checkbox"
                            aria-label="Ajouter À la française aux favoris">
                        <i class="unchecked-heart fa-regular fa-heart"></i>
                        <i class="checked-heart fa-solid fa-heart"></i>
                    </label>
                </div>
                    <div class="menu-group">
                        <div class="menu-animation-1">
                        <h2 class="menu-title">ENTRÉES</h2>
                            <div class="menu-card">
                                <label for="menu-card-1" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-1" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Tartare de poulpe acidulé</span>
                                    <span class="dish-description">Aux zestes orange</span>
                                </span>
                                <span class="menu-price"><span class="price">25€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-2" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-2" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Velouté de légumes d'antan</span>
                                    <span class="dish-description">Carotte, panais, topinambour</span>
                                </span>
                                <span class="menu-price"><span class="price">35€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-3" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-3" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Soupe à l'oignon</span>
                                    <span class="dish-description">Revisitée</span>
                                </span>
                                <span class="menu-price"><span class="price">20€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="menu-group">
                        <div class="menu-animation-2">
                        <h2 class="menu-title">PLATS</h2>
                            <div class="menu-card">
                                <label for="menu-card-4" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-4" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Coquilles Saint-Jacques</span>
                                    <span class="dish-description">Accompagnées d'une purée de panais</span>
                                </span>
                                <span class="menu-price"><span class="price">40€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-5" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-5" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Magret de canard</span>
                                    <span class="dish-description">Et parmentier de pommes de terre</span>
                                </span>
                                <span class="menu-price"><span class="price">35€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-6" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-6" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Pigeonneau d'Ille-et-Vilaine</span>
                                    <span class="dish-description">Sur son lit de gnocchis aux légumes</span>
                                </span>
                                <span class="menu-price"><span class="price">44€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="menu-group">
                        <div class="menu-animation-3">
                        <h2 class="menu-title">DESSERTS</h2>
                            <div class="menu-card">
                                <label for="menu-card-7" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-7" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Pétales de violettes glacés</span>
                                    <span class="dish-description">Et purée de noisettes</span>
                                </span>
                                <span class="menu-price"><span class="price">18€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-8" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-8" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Fondant au chocolat</span>
                                    <span class="dish-description">Revisité</span>
                                </span>
                                <span class="menu-price"><span class="price">22€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-9" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-9" class="menu-checkbox" aria-label="Plat sélectionné">
                                <span class="menu-card-text">
                                    <span class="dish-name">Millefeuille croustillant</span>
                                    <span class="dish-description">Myrtilles et pâte d'amande</span>
                                </span>
                                <span class="menu-price"><span class="price">23€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </span>

                                </label>
                            </div>
                        </div>
                    </div>
                <button class="btn">Commander</button>
                </section>
    </main>

    <footer>
        <h3>ohmyfood</h3>
            <ul>
                <li><a href="#"><i class="fa-solid fa-utensils"></i>Proposer un restaurant</a></li>
                <li><a href="#"><i class="fa-solid fa-handshake-angle"></i>Devenir partenaire</a></li>
                <li><a href="#">Mentions légales</a></li>
                <li><a href="mailto:ohmyfood@mail.fr">Contact</a></li>
            </ul>
    </footer>
</body>
</html>
