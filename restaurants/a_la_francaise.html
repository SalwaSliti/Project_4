<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohmyfood - La Palette du Goût</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../SASS/style.css">
</head>
<body>
    <header class="mp-header">
        <nav>
            <a class="back-button" href="/index.html">
            <i class="fa-solid fa-arrow-left"></i></a>
        </nav>
        <img src="/images/logo/ohmyfood.png">
    </header>

    <main>
        <div class="bg-menu">
            <img src="/images/restaurants/a_la_francaise.jpg" alt="Image du restaurant À la française">
        </div>
            <section class="menu-section">
                <h1>À la française</h1>
                <i class="fa-regular fa-heart"></i>
                    <div class="menu-group">
                        <h2 class="menu-title">ENTRÉES</h2>
                            <div class="menu-card">
                                <label for="menu-card-1" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-1" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Tartare de poulpe acidulé</h3>
                                    <p>Aux zestes orange</p>
                                </div>
                                <div class="menu-price"><span class="price">25€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-2" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-2" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Velouté de légumes d'antan</h3>
                                    <p>Carotte, panais, topinambour</p>
                                </div>
                                <div class="menu-price"><span class="price">35€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-3" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-3" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Soupe à l'oignon</h3>
                                    <p>Revisitée</p>
                                </div>
                                <div class="menu-price"><span class="price">20€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                    </div>
                    <div class="menu-group">
                        <h2 class="menu-title">PLATS</h2>
                            <div class="menu-card">
                                <label for="menu-card-4" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-4" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Coquilles Saint-Jacques</h3>
                                    <p>Accompagnées d'une purée de panais</p>
                                </div>
                                <div class="menu-price"><span class="price">40€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-5" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-5" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Magret de canard</h3>
                                    <p>Et parmentier de pommes de terre</p>
                                </div>
                                <div class="menu-price"><span class="price">35€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-6" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-6" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Pigeonneau d'Ille-et-Vilaine</h3>
                                    <p>Sur son lit de gnocchis aux légumes</p>
                                </div>
                                <div class="menu-price"><span class="price">44€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                    </div>
                    <div class="menu-group">
                        <h2 class="menu-title">DESSERTS</h2>
                            <div class="menu-card">
                                <label for="menu-card-7" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-7" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Pétales de violettes glacés</h3>
                                    <p>Et purée de noisettes</p>
                                </div>
                                <div class="menu-price"><span class="price">18€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-8" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-8" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Fondant au chocolat</h3>
                                    <p>Revisité</p>
                                </div>
                                <div class="menu-price"><span class="price">22€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                            <div class="menu-card">
                                <label for="menu-card-9" class="menu-card-btn">
                                    <input type="checkbox" id="menu-card-9" class="menu-checkbox" aria-label="Plat sélectionné">
                                <div class="menu-card-text">
                                    <h3>Millefeuille croustillant</h3>
                                    <p>Myrtilles et pâte d'amande</p>
                                </div>
                                <div class="menu-price"><span class="price">23€</span>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                </label>
                            </div>
                    </div>
                <button class="btn" href="#">Commander</button>
            </section>
        </div>
    </main>

    <footer>
        <div class="bg_footer">
            <h3>ohmyfood</h3>
                <ul>
                   <li><a href="#"><i class="fa-solid fa-utensils"></i>Proposer un restaurant</a></li>
                    <li><a href="#"><i class="fa-solid fa-handshake"></i>Devenir partenaire</a></li>
                    <li><a href="#"><i></i>Mentions légales</a></li>
                    <li><a href="#"><i></i>Contact</a></li>
                </ul>
        </div>
    </footer>
</body>
</html>
